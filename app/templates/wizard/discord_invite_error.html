{% extends "base.html" %}
{% block title %}
  {{ _("Discord") }}
{% endblock title %}
{% block main %}
  <section class="bg-gray-50 dark:bg-gray-900">
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto h-screen lg:py-0">
      <div class="w-full bg-white rounded-lg shadow-sm dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
        <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
          <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
            {{ _("Discord invite unavailable") }}
          </h1>
          <p class="text-sm text-gray-600 dark:text-gray-400">
            {{ _("Your Discord invite could not be created right now. Please try again later, or ask the server administrator for an invite.") }}
          </p>
        </div>
      </div>
    </div>
  </section>
{% endblock main %}
